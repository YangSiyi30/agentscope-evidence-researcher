name: Offline regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked project and coverage tool
        run: |
          python -m pip install uv==0.12.13
          uv sync --locked --group dev
          uv pip install --no-deps coverage==7.6.12
      - name: Restore byte-bound public regression fixtures
        run: uv run --no-sync python scripts/restore_test_fixtures.py
      - name: Static checks
        run: uv run --no-sync ruff check src tests scripts
      - name: Offline unit and integration tests with branch coverage
        run: uv run --no-sync coverage run -m unittest discover -s tests -t .
      - name: Report coverage
        if: always()
        run: |
          uv run --no-sync coverage report
          uv run --no-sync coverage xml
          uv run --no-sync coverage html
      - name: Clean-source offline smoke validation
        run: uv run --no-sync python scripts/verify_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-checks
          path: |
            reports/coverage/
            reports/source-check-*/
