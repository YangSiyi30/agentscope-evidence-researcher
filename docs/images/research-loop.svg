<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1230" viewBox="0 0 1500 1230" role="img" aria-labelledby="title desc"><title id="title">单次研究核心循环</title><desc id="desc">run_research初始化一次Session、Prompt、Toolkit和Agent；框架请求模型，工具调用经过SDK和Session；允许才调用后端，结果或失败回填下一轮模型，结束后检查并返回run字典。终端和文件查看不属于此循环。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#496078"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2864AD"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#183149}.title{font-size:34px;font-weight:700}.h{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#496078}.label{font-size:17px;fill:#496078}</style><rect width="1500" height="1230" fill="#fff"/><text x="80" y="66" class="title" text-anchor="start">一次研究：模型怎样取证，再形成回答</text><text x="80" y="104" class="small" text-anchor="start">核心入口 run_research · 单Agent · 同一题复用Session状态 · 终端与文件查看在循环外</text><rect x="80" y="140" width="1340" height="110" rx="16" fill="#F1F5F9" stroke="#B6C6D6" stroke-width="1.5"/><text x="102" y="180" class="h" text-anchor="start">开始一次任务：问题 + 配置 + 可选来源URL</text><text x="102" y="218" class="body" text-anchor="start">run_research 新建 Session、组装Prompt和工具schema、创建Agent；指定URL只登记位置，不伪造摘要。</text><rect x="80" y="345" width="340" height="180" rx="16" fill="#EAF2FF" stroke="#B6C6D6" stroke-width="1.5"/><text x="102" y="385" class="h" text-anchor="start">1  框架请求模型</text><text x="102" y="423" class="body" text-anchor="start">AgentScope组织当前上下文</text><text x="102" y="452" class="body" text-anchor="start">模型适配器返回响应</text><text x="102" y="481" class="body" text-anchor="start">可能是工具请求或最终文本</text><rect x="550" y="345" width="350" height="180" rx="16" fill="#EAF2FF" stroke="#B6C6D6" stroke-width="1.5"/><text x="572" y="385" class="h" text-anchor="start">2  SDK解释工具请求</text><text x="572" y="423" class="body" text-anchor="start">name / id / 参数</text><text x="572" y="452" class="body" text-anchor="start">Toolkit匹配已注册工具</text><text x="572" y="481" class="body" text-anchor="start">FunctionTool做参数校验</text><rect x="1030" y="345" width="390" height="180" rx="16" fill="#FFF3DE" stroke="#B6C6D6" stroke-width="1.5"/><text x="1052" y="385" class="h" text-anchor="start">3  Session检查执行许可</text><text x="1052" y="423" class="body" text-anchor="start">来源 / 参数 / 配额 / 去重 / 锁</text><text x="1052" y="452" class="body" text-anchor="start">同一题状态由应用控制</text><text x="1052" y="481" class="body" text-anchor="start">未获许可，不调用实际后端</text><rect x="1030" y="660" width="390" height="170" rx="16" fill="#F1EBFF" stroke="#B6C6D6" stroke-width="1.5"/><text x="1052" y="700" class="h" text-anchor="start">4  允许后调用实际后端</text><text x="1052" y="738" class="body" text-anchor="start">本地，或MCP桥 → 工具进程</text><text x="1052" y="767" class="body" text-anchor="start">搜索/读页尝试包含失败</text><text x="1052" y="796" class="body" text-anchor="start">返回数据后校验，成功才提交</text><rect x="550" y="660" width="350" height="170" rx="16" fill="#FFF3DE" stroke="#B6C6D6" stroke-width="1.5"/><text x="572" y="700" class="h" text-anchor="start">5  应用返回结构化观察</text><text x="572" y="738" class="body" text-anchor="start">ToolChunk中的JSON文本</text><text x="572" y="767" class="body" text-anchor="start">保存证据或公开失败类别</text><text x="572" y="796" class="body" text-anchor="start">附当前预算与停止状态</text><rect x="80" y="660" width="340" height="170" rx="16" fill="#EAF2FF" stroke="#B6C6D6" stroke-width="1.5"/><text x="102" y="700" class="h" text-anchor="start">6  结果进入下一轮上下文</text><text x="102" y="738" class="body" text-anchor="start">SDK按调用id配对结果</text><text x="102" y="767" class="body" text-anchor="start">生成ToolResultBlock</text><text x="102" y="796" class="body" text-anchor="start">模型只看消息，不直读字典</text><rect x="80" y="975" width="1340" height="150" rx="16" fill="#E9F7EF" stroke="#B6C6D6" stroke-width="1.5"/><text x="102" y="1015" class="h" text-anchor="start">7  循环结束后：生成可检查的run字典</text><text x="102" y="1053" class="body" text-anchor="start">区分正常结束、超时、模型错误与截断；检查引用层次、长度、程序计数与已知用量。</text><text x="102" y="1082" class="body" text-anchor="start">显式开启时才可能调用一次无工具缩稿（默认关闭）；最后将run交还调用者保存。</text><polyline points="250,250 250,345" fill="none" stroke="#2864AD" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><text x="270" y="302" class="label" text-anchor="start">首次消息</text><polyline points="420,435 550,435" fill="none" stroke="#2864AD" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><text x="485" y="415" class="label" text-anchor="middle">工具请求</text><polyline points="900,435 1030,435" fill="none" stroke="#496078" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="965" y="415" class="label" text-anchor="middle">通过校验</text><polyline points="1225,525 1225,660" fill="none" stroke="#496078" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1245" y="594" class="label" text-anchor="start">发起前计尝试</text><polyline points="1030,745 900,745" fill="none" stroke="#496078" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="965" y="723" class="label" text-anchor="middle">数据或失败</text><polyline points="1030,480 965,480 965,745 900,745" fill="none" stroke="#496078" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="973" y="580" class="label" text-anchor="start">拦截</text><polyline points="550,745 420,745" fill="none" stroke="#2864AD" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><text x="485" y="723" class="label" text-anchor="middle">ToolChunk</text><polyline points="250,660 250,525" fill="none" stroke="#2864AD" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/><text x="270" y="590" class="label" text-anchor="start">结果回填后</text><text x="270" y="615" class="label" text-anchor="start">再次请求模型</text><polyline points="650,525 650,570 430,570 430,630 360,630 360,660" fill="none" stroke="#2864AD" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="7 5"/><text x="450" y="552" class="label" text-anchor="start">SDK提前拒绝：框架回填结果，没有应用trace</text><polyline points="80,435 40,435 40,1050 80,1050" fill="none" stroke="#496078" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="90" y="911" class="small" text-anchor="start">最终文本，或任务因异常/时限等结束</text><text x="80" y="1180" class="small" text-anchor="start">蓝：框架与消息    黄：应用许可和证据    紫：实际能力    绿：循环后处理    虚线：拒绝路径</text></svg>